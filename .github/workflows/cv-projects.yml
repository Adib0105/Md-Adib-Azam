name: Validate CV portfolio projects

on:
  push:
    paths:
      - "2[6-9]-**"
      - "3[0-9]-**"
      - "4[0-5]-**"
      - "run_cv_project_tests.py"
  pull_request:
    paths:
      - "2[6-9]-**"
      - "3[0-9]-**"
      - "4[0-5]-**"
      - "run_cv_project_tests.py"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Validate all projects
        run: python run_cv_project_tests.py
