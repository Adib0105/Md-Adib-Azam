name: JARVIS CI

on:
  push:
    paths:
      - "jarvis-ai/**"
      - ".github/workflows/jarvis-ci.yml"
  pull_request:
    paths:
      - "jarvis-ai/**"
      - ".github/workflows/jarvis-ci.yml"

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: python -m compileall -q jarvis-ai
