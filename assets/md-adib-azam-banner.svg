<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Md Adib Azam portfolio banner</title>
  <desc id="description">A colourful personal portfolio banner for Md Adib Azam, featuring code, data, design and digital skills.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152d"/>
      <stop offset="0.48" stop-color="#102a56"/>
      <stop offset="1" stop-color="#291854"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <radialGradient id="glowBlue">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#c4b5fd" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="34" fill="url(#background)"/>
  <rect width="1200" height="420" rx="34" fill="url(#grid)"/>
  <circle cx="190" cy="60" r="260" fill="url(#glowBlue)"/>
  <circle cx="1080" cy="390" r="300" fill="url(#glowPink)"/>

  <rect x="84" y="84" width="230" height="230" rx="58" fill="#020617" opacity="0.28"/>
  <g>
    <rect x="74" y="72" width="230" height="230" rx="58" fill="#0f2347" stroke="url(#accent)" stroke-width="4"/>
    <circle cx="189" cy="187" r="82" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
    <text x="189" y="208" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800">MA</text>
    <path d="M128 244H250" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="356" y="118" fill="#67e8f9" font-size="22" font-weight="700" letter-spacing="5">PERSONAL PORTFOLIO</text>
    <text x="352" y="202" fill="white" font-size="66" font-weight="800">Md Adib Azam</text>
    <rect x="356" y="226" width="615" height="6" rx="3" fill="url(#accent)"/>
    <text x="356" y="274" fill="#dbeafe" font-size="25" font-weight="600">Code  ·  Data  ·  Web  ·  Design  ·  Digital</text>
    <text x="356" y="319" fill="#a5b4fc" font-size="19">Practical projects, steady learning and useful digital work.</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">
    <g transform="translate(356 347)">
      <rect width="132" height="38" rx="19" fill="#083344" stroke="#22d3ee" stroke-opacity="0.7"/>
      <text x="66" y="25" text-anchor="middle" fill="#a5f3fc">PROGRAMMING</text>
    </g>
    <g transform="translate(500 347)">
      <rect width="108" height="38" rx="19" fill="#312e81" stroke="#818cf8" stroke-opacity="0.8"/>
      <text x="54" y="25" text-anchor="middle" fill="#c7d2fe">ANALYTICS</text>
    </g>
    <g transform="translate(620 347)">
      <rect width="88" height="38" rx="19" fill="#3b1b5a" stroke="#c084fc" stroke-opacity="0.8"/>
      <text x="44" y="25" text-anchor="middle" fill="#e9d5ff">DESIGN</text>
    </g>
    <g transform="translate(720 347)">
      <rect width="132" height="38" rx="19" fill="#4c1d36" stroke="#fb7185" stroke-opacity="0.8"/>
      <text x="66" y="25" text-anchor="middle" fill="#fecdd3">AUTOMATION</text>
    </g>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1036 100l-34 34 34 34" stroke="#67e8f9" stroke-width="7"/>
    <path d="M1092 100l34 34-34 34" stroke="#fb7185" stroke-width="7"/>
    <path d="M1080 88l-30 94" stroke="#c4b5fd" stroke-width="7"/>
  </g>
</svg>
