<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campaign ROI Planner</title><link rel="stylesheet" href="style.css"></head>
<body><main><h1>Plan for outcomes.</h1><p class="lead">Turn media assumptions into a transparent full-funnel business scenario.</p>
  <section class="layout"><form id="planner"><h2>Campaign inputs</h2><label>Budget (INR)<input name="budget" type="number" value="30000" min="0"></label><label>Impressions<input name="impressions" type="number" value="200000" min="0"></label><label>CTR (%)<input name="ctr" type="number" value="1.8" step=".1"></label><label>Lead rate (%)<input name="leadRate" type="number" value="8" step=".1"></label><label>Close rate (%)<input name="closeRate" type="number" value="20" step=".1"></label><label>Order value<input name="orderValue" type="number" value="8000" min="0"></label></form>
  <div class="dashboard"><div class="metrics"><article class="metric"><span>Clicks</span><strong id="clicks"></strong></article><article class="metric"><span>Leads</span><strong id="leads"></strong></article><article class="metric"><span>Customers</span><strong id="customers"></strong></article><article class="metric"><span>Revenue</span><strong id="revenue"></strong></article><article class="metric"><span>ROAS</span><strong id="roas"></strong></article><article class="metric"><span>CPA</span><strong id="cpa"></strong></article></div><p class="note">Revenue break-even: <strong id="break-even"></strong></p></div></section>
</main><script src="logic.js"></script><script src="app.js"></script></body></html>
