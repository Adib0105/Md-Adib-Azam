<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Content Calendar</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><div><p>Go Digital Pro</p><h1>Content calendar</h1></div><div class="badge">Published <strong id="progress">0%</strong></div></header>
<section class="layout"><form id="post-form"><h2>Plan a post</h2><label>Title</label><input name="title" required><label>Channel</label><select name="channel"><option>LinkedIn</option><option>Instagram</option><option>YouTube</option><option>Facebook</option></select><label>Date</label><input type="date" name="date" required><label>Time</label><input type="time" name="time" required><label>Campaign</label><input name="campaign"><button>Add to calendar</button></form><div id="queue"></div></section>
</main><script src="logic.js"></script><script src="app.js"></script></body></html>
