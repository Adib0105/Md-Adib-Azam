<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAQ Search Interface</title><style>:root{--accent:hsl(191 78% 55%)}*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#07111f;color:#eaf2ff}main{max-width:1000px;margin:auto;padding:48px 22px}header{padding:34px;border:1px solid #24364d;border-radius:24px;background:linear-gradient(135deg,#101f35,#0b1524)}h1{font-size:clamp(2rem,6vw,4rem);margin:.2em 0}.tag{color:var(--accent);font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-top:24px}article{background:#101c2d;padding:22px;border-radius:18px}button{background:var(--accent);border:0;padding:12px 18px;border-radius:999px;font-weight:700}</style></head><body><main><header><span class="tag">PROJECT 19</span><h1>FAQ Search Interface</h1><p>A responsive, accessible interface designed for a real-world portfolio use case.</p><button id="action">Open dashboard</button></header><section class="grid" id="cards"></section></main><script>const data=[['Users',119],['Tasks',59],['Success','99%'],['SLA','99%']];document.querySelector('#cards').innerHTML=data.map(([k,v])=>`<article><small>${k}</small><h2>${v}</h2><p>Live demo metric</p></article>`).join('');document.querySelector('#action').onclick=()=>alert('FAQ Search Interface demo ready');</script></body></html>
