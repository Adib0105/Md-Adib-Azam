<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Scores CRM leads from fit, engagement and recency">
  <title>CRM Lead Board</title>
  <style>
    :root{--accent:hsl(260 80% 58%);--bg:#07111f;--panel:#101d30;--text:#edf4ff;--muted:#9fb0c8}
    *{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui;background:radial-gradient(circle at 80% 0,hsl(260 70% 22%),var(--bg) 42%);color:var(--text)}
    main{width:min(100% - 32px,980px);margin:0 auto;padding:56px 0}.eyebrow{color:var(--accent);font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    h1{font-size:clamp(2.2rem,7vw,4.8rem);line-height:1.02;margin:.2em 0}.sub{color:var(--muted);max-width:70ch}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:30px}.card{padding:22px;border:1px solid #263a54;border-radius:20px;background:color-mix(in srgb,var(--panel) 92%,transparent)}
    textarea,pre{width:100%;min-height:320px;margin:12px 0 0;padding:16px;border:1px solid #344b68;border-radius:14px;background:#07101d;color:#dceaff;overflow:auto}
    button{margin-top:14px;border:0;border-radius:999px;padding:12px 20px;background:var(--accent);color:#06101e;font-weight:800;cursor:pointer}button:focus-visible,textarea:focus-visible{outline:3px solid white;outline-offset:3px}
    @media(max-width:760px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body><main>
  <p class="eyebrow">Web Project 20</p><h1>CRM Lead Board</h1><p class="sub">Scores CRM leads from fit, engagement and recency.</p>
  <div class="grid"><section class="card"><h2>Editable input</h2><label for="input">Project data (JSON)</label><textarea id="input" spellcheck="false"></textarea><button id="run">Run project</button></section>
  <section class="card" aria-live="polite"><h2>Calculated output</h2><pre id="output"></pre></section></div>
</main><script type="module">
import {sample,calculate} from "./logic.js";
const input=document.querySelector("#input"),output=document.querySelector("#output");
input.value=JSON.stringify(sample,null,2);
function run(){try{output.textContent=JSON.stringify(calculate(JSON.parse(input.value)),null,2)}catch(error){output.textContent="Error: "+error.message}}
document.querySelector("#run").addEventListener("click",run);run();
</script></body></html>
